name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build
      - name: SPA fallback
        # GitHub Pages sirve 404.html para rutas desconocidas: asi /necesidades/123 abre la app.
        run: cp dist/sevilla-renace/browser/index.html dist/sevilla-renace/browser/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/sevilla-renace/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
